name: Release MacPorts Repository

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'devel/**'
      - '.github/workflows/release-ports.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MacPorts
        run: |
          if [ ! -x /opt/local/bin/portindex ]; then
            MACOS_VER=\$(sw_vers -productVersion | cut -d. -f1)
            case "\$MACOS_VER" in
              15) MACOS_NAME="15-Sequoia" ;;
              14) MACOS_NAME="14-Sonoma" ;;
              13) MACOS_NAME="13-Ventura" ;;
              *)  MACOS_NAME="15-Sequoia" ;;
            esac
            PKG_URL=\$(curl -s https://github.com | grep "browser_download_url.*\${MACOS_NAME}\.pkg\"" | cut -d '"' -f 4)
            curl -L -o /tmp/macports.pkg "\$PKG_URL"
            sudo installer -pkg /tmp/macports.pkg -target /
          fi
          echo "/opt/local/bin" >> \$GITHUB_PATH

      - name: Generate PortIndex and lint
        run: |
          portindex
          port lint --nitpick ./devel/ngraph-gtk || true

      - name: Package ports.tar.gz
        run: |
          tar -czf ports.tar.gz devel PortIndex PortIndex.quick

      - name: Upload ports.tar.gz to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MacPorts Repository (Latest)
          body: |
            Automated MacPorts repository archive containing `Portfile` and pre-generated `PortIndex`.

            ### Usage
            Add the following line above `rsync://...` in `/opt/local/etc/macports/sources.conf`:
            ```text
            https://github.com\${{ github.repository }}/releases/download/latest/ports.tar.gz
            ```
            Then run `sudo port selfupdate` and `sudo port install ngraph-gtk-devel`.
          files: ports.tar.gz
