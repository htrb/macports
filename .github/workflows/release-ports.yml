name: Update PortIndex

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'devel/**'
      - '.github/workflows/release-ports.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-portindex:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install MacPorts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -x /opt/local/bin/portindex ]; then
            MACOS_VER=$(sw_vers -productVersion | cut -d. -f1)
            case "$MACOS_VER" in
              26) MACOS_PATTERNS="26-|Tahoe|-26\." ;;
              15) MACOS_PATTERNS="15-Sequoia|Sequoia|-15\." ;;
              14) MACOS_PATTERNS="14-Sonoma|Sonoma|-14\." ;;
              13) MACOS_PATTERNS="13-Ventura|Ventura|-13\." ;;
              *)  MACOS_PATTERNS="26-|15-Sequoia|Sequoia" ;;
            esac

            PKG_URL=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/macports/macports-base/releases \
              | grep -Eo 'https://[^"[:space:]]+\.pkg' \
              | grep -E "$MACOS_PATTERNS" \
              | head -n 1 || true)

            if [ -z "$PKG_URL" ]; then
              echo "Fallback to latest .pkg asset in releases:" >&2
              PKG_URL=$(curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/macports/macports-base/releases \
                | grep -Eo 'https://[^"[:space:]]+\.pkg' \
                | head -n 1 || true)
            fi

            if [ -z "$PKG_URL" ]; then
              echo "Failed to resolve MacPorts .pkg URL for macOS $MACOS_VER" >&2
              exit 1
            fi

            echo "Downloading MacPorts installer from: $PKG_URL"
            curl -fsSL -o /tmp/macports.pkg "$PKG_URL"
            sudo installer -pkg /tmp/macports.pkg -target /
          fi
          echo "/opt/local/bin" >> "$GITHUB_PATH"

      - name: Generate PortIndex and lint
        run: |
          portindex
          port lint --nitpick ./devel/ngraph-gtk || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PortIndex PortIndex.quick
          if ! git diff --staged --quiet; then
            git commit -m "Update PortIndex [skip ci]"
            git push
          fi
