name: Release MacPorts Repository

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'devel/**'
      - '.github/workflows/release-ports.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MacPorts
        run: |
          if [ ! -x /opt/local/bin/portindex ]; then
            MACOS_VER=$(sw_vers -productVersion | cut -d. -f1)
            case "$MACOS_VER" in
              15) MACOS_PATTERNS="15-Sequoia|Sequoia|-15\." ;;
              14) MACOS_PATTERNS="14-Sonoma|Sonoma|-14\." ;;
              13) MACOS_PATTERNS="13-Ventura|Ventura|-13\." ;;
              *)  MACOS_PATTERNS="15-Sequoia|Sequoia|-15\." ;;
            esac
            PKG_URL=$(curl -fsSL https://api.github.com/repos/macports/macports-base/releases \
              | grep -Eo 'https://[^"[:space:]]+\.pkg' \
              | grep -E "$MACOS_PATTERNS" \
              | head -n 1 || true)

            if [ -z "$PKG_URL" ]; then
              echo "Available .pkg URLs from latest releases:" >&2
              curl -fsSL https://api.github.com/repos/macports/macports-base/releases \
                | grep -Eo 'https://[^"[:space:]]+\.pkg' \
                | head -n 20 >&2 || true
              echo "Failed to resolve MacPorts .pkg URL for macOS $MACOS_VER ($MACOS_PATTERNS)" >&2
              exit 1
            fi
            curl -fsSL -o /tmp/macports.pkg "$PKG_URL"
            sudo installer -pkg /tmp/macports.pkg -target /
          fi
          echo "/opt/local/bin" >> "$GITHUB_PATH"

      - name: Generate PortIndex and lint
        run: |
          portindex
          port lint --nitpick ./devel/ngraph-gtk || true

      - name: Package ports.tar.gz
        run: |
          tar -czf ports.tar.gz devel PortIndex PortIndex.quick

      - name: Upload ports.tar.gz to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MacPorts Repository (Latest)
          body: |
            Automated MacPorts repository archive containing `Portfile` and pre-generated `PortIndex`.

            ### Usage
            Add the following line above `rsync://...` in `/opt/local/etc/macports/sources.conf`:
            ```text
            [https://github.com/htrb/macports/releases/download/latest/ports.tar.gz](https://github.com/htrb/macports/releases/download/latest/ports.tar.gz)
            ```
            Then run `sudo port selfupdate` and `sudo port install ngraph-gtk-devel`.
          files: ports.tar.gz
